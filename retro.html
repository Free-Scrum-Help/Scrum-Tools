<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint Retrospective — S4 Labour</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy-900:#080E1A; --navy-800:#0D1829; --navy-700:#132038;
  --navy-600:#1A2A48; --navy-500:#243659;
  --orange:#FF6A1A; --orange-dim:rgba(255,106,26,0.18); --orange-border:rgba(255,106,26,0.45);
  --text-primary:#F0F4FF; --text-secondary:#8BA0C4; --text-tertiary:#4F6080;
  --border:rgba(255,255,255,0.07); --border-strong:rgba(255,255,255,0.13);
  --green:#22C97A; --green-dim:rgba(34,201,122,0.16); --green-border:rgba(34,201,122,0.4);
  --amber:#F5A623; --amber-dim:rgba(245,166,35,0.16); --amber-border:rgba(245,166,35,0.4);
  --red:#FF5252; --red-dim:rgba(255,82,82,0.13); --red-border:rgba(255,82,82,0.35);
  --blue:#4A9EFF; --blue-dim:rgba(74,158,255,0.14); --blue-border:rgba(74,158,255,0.38);
  --purple:#A78BFA; --purple-dim:rgba(167,139,250,0.14); --purple-border:rgba(167,139,250,0.38);
  --r:8px; --r-lg:14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--navy-800);color:var(--text-primary);min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(ellipse 80% 50% at 20% -10%,rgba(255,106,26,0.07) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%,rgba(34,201,122,0.06) 0%,transparent 55%);}

.btn{font-family:'IBM Plex Sans',sans-serif;font-size:0.75rem;font-weight:600;padding:6px 13px;border-radius:6px;border:none;cursor:pointer;transition:all 0.15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.btn-primary{background:var(--orange);color:#fff;}.btn-primary:hover{background:#FF7E3D;}
.btn-ghost{background:rgba(255,255,255,0.06);color:var(--text-secondary);border:1px solid var(--border);}.btn-ghost:hover{background:rgba(255,255,255,0.11);color:var(--text-primary);}
.btn-danger{background:rgba(255,82,82,0.08);color:var(--red);border:1px solid rgba(255,82,82,0.18);}.btn-danger:hover{background:rgba(255,82,82,0.16);}
.btn-anon-on{background:rgba(167,139,250,0.15);color:var(--purple);border:1px solid rgba(167,139,250,0.35);}
.btn-anon-on:hover{background:rgba(167,139,250,0.25);}

/* ── Header ── */
.hdr{background:var(--navy-900);border-bottom:1px solid var(--border);padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:200;}
.logo{font-family:'Outfit',sans-serif;font-size:0.92rem;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap;}
.logo-pip{width:7px;height:7px;background:var(--orange);border-radius:50%;flex-shrink:0;}
.logo em{color:var(--orange);font-style:normal;}
.hdr-center{display:flex;align-items:center;gap:8px;flex:1;max-width:560px;margin:0 auto;}
.hdr-input{background:var(--navy-700);border:1px solid var(--border-strong);border-radius:6px;color:var(--text-primary);font-family:'IBM Plex Sans',sans-serif;font-size:0.82rem;padding:5px 11px;outline:none;transition:border-color 0.2s;}
.hdr-input:focus{border-color:var(--orange);}
.hdr-input::placeholder{color:var(--text-tertiary);}
.hdr-input-name{width:150px;}.hdr-input-date{width:118px;}
.save-lz{font-size:0.68rem;color:var(--text-tertiary);padding:3px 9px;border-radius:20px;border:1px solid var(--border);white-space:nowrap;transition:all 0.3s;}
.save-lz.saved{color:var(--green);border-color:var(--green-border);}
.hdr-right{display:flex;gap:6px;align-items:center;flex-shrink:0;}

.format-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:var(--navy-600);border:1px solid var(--border-strong);cursor:pointer;font-size:0.72rem;font-weight:700;color:var(--text-secondary);transition:all 0.15s;white-space:nowrap;}
.format-pill:hover{border-color:rgba(255,255,255,0.25);color:var(--text-primary);}
.format-pill-dot{width:7px;height:7px;border-radius:50%;}

/* Team badge */
.team-badge{font-size:0.68rem;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid;white-space:nowrap;}
.team-rota{background:rgba(34,201,122,0.12);color:var(--green);border-color:var(--green-border);}
.team-mobile{background:rgba(74,158,255,0.12);color:var(--blue);border-color:var(--blue-border);}
.team-payroll{background:rgba(167,139,250,0.12);color:var(--purple);border-color:var(--purple-border);}
.team-none{background:var(--navy-600);color:var(--text-tertiary);border-color:var(--border-strong);}

/* Share bar */
.share-bar{background:var(--navy-700);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.share-label{font-size:0.72rem;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.08em;white-space:nowrap;}
.share-code-box{display:flex;align-items:center;gap:8px;background:var(--navy-900);border:1px solid var(--border-strong);border-radius:7px;padding:5px 12px;flex:1;max-width:420px;}
.share-code{font-family:'Outfit',sans-serif;font-size:0.85rem;font-weight:700;color:var(--orange);flex:1;word-break:break-all;}
.contrib-indicator{display:flex;align-items:center;gap:6px;font-size:0.72rem;color:var(--text-tertiary);}
.contrib-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

/* Board layout */
.page{padding:24px 24px 120px;max-width:1500px;margin:0 auto;}
.columns{display:grid;gap:16px;margin-bottom:24px;}
.cols-3{grid-template-columns:repeat(3,1fr);}
.cols-4{grid-template-columns:repeat(4,1fr);}
.cols-5{grid-template-columns:repeat(5,1fr);}
@media(max-width:1100px){.cols-4,.cols-5{grid-template-columns:repeat(2,1fr);}}
@media(max-width:900px){.columns{grid-template-columns:1fr!important;}}

/* Column card */
.col{border-radius:var(--r-lg);display:flex;flex-direction:column;min-height:340px;overflow:hidden;border:1px solid var(--border);}
.col-hdr{padding:14px 16px 13px;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.col-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.col-title{font-family:'Outfit',sans-serif;font-size:0.85rem;font-weight:800;text-transform:uppercase;letter-spacing:0.07em;flex:1;}
.col-desc{font-size:0.68rem;margin-top:2px;opacity:0.7;}
.col-count{font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:10px;}
.col-body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1;background:var(--navy-700);}
.col-add{border:1.5px dashed rgba(255,255,255,0.12);border-radius:var(--r);padding:10px 13px;background:transparent;color:var(--text-tertiary);font-family:'IBM Plex Sans',sans-serif;font-size:0.82rem;cursor:pointer;transition:all 0.15s;text-align:left;width:100%;}
.col-add:hover{border-color:rgba(255,255,255,0.25);color:var(--text-secondary);background:rgba(255,255,255,0.03);}

/* Sticky grouping */
.sticky-group{border:1px solid rgba(255,255,255,0.1);border-radius:var(--r);overflow:hidden;margin-bottom:4px;}
.sticky-group-hdr{padding:7px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;background:rgba(255,255,255,0.04);}
.sticky-group-label{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-secondary);flex:1;outline:none;background:none;border:none;font-family:'IBM Plex Sans',sans-serif;cursor:text;}
.sticky-group-label:focus{color:var(--text-primary);}
.sticky-group-count{font-size:0.62rem;color:var(--text-tertiary);background:var(--navy-600);padding:1px 6px;border-radius:8px;}
.sticky-group-del{background:none;border:none;cursor:pointer;color:var(--text-tertiary);font-size:0.75rem;opacity:0;transition:opacity 0.15s;}
.sticky-group-hdr:hover .sticky-group-del{opacity:1;}
.sticky-group-del:hover{color:var(--red);}
.sticky-group-body{padding:8px;display:flex;flex-direction:column;gap:6px;background:rgba(0,0,0,0.12);}
.group-add-area{border:1px dashed rgba(255,255,255,0.08);border-radius:6px;padding:8px;min-height:32px;font-size:0.72rem;color:var(--text-tertiary);text-align:center;transition:all 0.15s;}
.group-add-area.drag-over{border-color:var(--orange);background:var(--orange-dim);color:var(--orange);}
.add-group-btn{border:none;background:none;cursor:pointer;font-size:0.72rem;color:var(--text-tertiary);padding:4px 8px;border-radius:5px;transition:all 0.15s;font-family:'IBM Plex Sans',sans-serif;display:inline-flex;align-items:center;gap:4px;}
.add-group-btn:hover{color:var(--text-secondary);background:rgba(255,255,255,0.05);}

/* Sticky card */
@keyframes stickyIn{from{opacity:0;transform:scale(0.94) translateY(6px);}to{opacity:1;transform:none;}}
.sticky{border-radius:var(--r);padding:12px 13px;position:relative;animation:stickyIn 0.22s ease both;border-left-width:3px;border-left-style:solid;cursor:grab;}
.sticky:active{cursor:grabbing;}
.sticky.dragging{opacity:0.4;transform:scale(0.97);}
.sticky-text{font-size:0.88rem;line-height:1.5;color:var(--text-primary);word-break:break-word;}
.sticky-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px;}
.sticky-author{display:flex;align-items:center;gap:5px;}
.author-dot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.58rem;font-weight:800;color:#fff;flex-shrink:0;}
.author-name{font-size:0.68rem;color:var(--text-tertiary);font-weight:500;}
.sticky-meta{display:flex;align-items:center;gap:6px;}
.vote-btn{display:flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid var(--border-strong);cursor:pointer;font-size:0.68rem;font-weight:700;color:var(--text-secondary);transition:all 0.15s;font-family:'IBM Plex Sans',sans-serif;}
.vote-btn:hover{background:rgba(255,106,26,0.15);border-color:var(--orange-border);color:var(--orange);}
.vote-btn.voted{background:var(--orange-dim);border-color:var(--orange-border);color:var(--orange);}
.sticky-del{background:none;border:none;cursor:pointer;color:var(--text-tertiary);font-size:0.9rem;padding:2px;opacity:0;transition:opacity 0.15s;}
.sticky:hover .sticky-del{opacity:1;}
.sticky-del:hover{color:var(--red);}
.inherited-badge{display:inline-flex;align-items:center;gap:4px;font-size:0.62rem;font-weight:700;color:var(--blue);background:rgba(74,158,255,0.12);border:1px solid rgba(74,158,255,0.25);border-radius:10px;padding:1px 7px;margin-bottom:5px;}

/* Inline editor */
.sticky-editor{border-radius:var(--r);padding:10px 12px;border:1.5px solid var(--orange);background:var(--navy-600);animation:stickyIn 0.15s ease both;}
.sticky-editor textarea{background:none;border:none;outline:none;width:100%;font-family:'IBM Plex Sans',sans-serif;font-size:0.88rem;color:var(--text-primary);line-height:1.5;resize:none;min-height:52px;}
.sticky-editor textarea::placeholder{color:var(--text-tertiary);}
.editor-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.editor-hint{font-size:0.68rem;color:var(--text-tertiary);}

/* Summary */
.summary{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.sum-card{border-radius:var(--r);padding:12px 18px;display:flex;flex-direction:column;gap:3px;min-width:100px;border:1px solid transparent;}
.sum-lbl{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;}
.sum-val{font-family:'Outfit',sans-serif;font-size:1.55rem;font-weight:800;}

/* Actions */
.actions-card{background:var(--navy-700);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;}
.actions-hdr{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.actions-hdr h2{font-family:'Outfit',sans-serif;font-size:0.85rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-secondary);display:flex;align-items:center;gap:8px;}
.act-count{font-size:0.68rem;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--orange-dim);color:var(--orange);border:1px solid var(--orange-border);}
.action-table{width:100%;border-collapse:collapse;}
.action-table thead th{padding:8px 16px;font-size:0.64rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-tertiary);text-align:left;border-bottom:1px solid var(--border);}
.action-table tbody td{padding:10px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
.action-table tbody tr:last-child td{border-bottom:none;}
.action-table tbody tr:hover td{background:rgba(255,255,255,0.015);}
.act-input{background:transparent;border:none;outline:none;color:var(--text-primary);font-family:'IBM Plex Sans',sans-serif;font-size:0.84rem;width:100%;}
.act-input::placeholder{color:var(--text-tertiary);}
.status-sel{background:var(--navy-600);border:1px solid var(--border-strong);border-radius:5px;color:var(--text-secondary);font-family:'IBM Plex Sans',sans-serif;font-size:0.75rem;padding:3px 7px;outline:none;cursor:pointer;}
.carry-btn{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:10px;background:transparent;border:1px solid var(--border);cursor:pointer;font-size:0.7rem;font-weight:600;color:var(--text-tertiary);transition:all 0.15s;font-family:'IBM Plex Sans',sans-serif;white-space:nowrap;}
.carry-btn:hover{border-color:var(--orange-border);color:var(--orange);}
.carry-btn.on{background:var(--orange-dim);border-color:var(--orange-border);color:var(--orange);}
.act-del{background:none;border:none;cursor:pointer;color:var(--text-tertiary);font-size:0.85rem;padding:3px;opacity:0;transition:opacity 0.15s;}
.action-table tbody tr:hover .act-del{opacity:1;}
.act-del:hover{color:var(--red);}
.add-action-row{padding:12px 16px;border-top:1px solid var(--border);}
.inherited-action{background:rgba(74,158,255,0.04);}

/* Format picker */
.format-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.fmt-card{border:1.5px solid var(--border-strong);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:all 0.15s;background:var(--navy-600);}
.fmt-card:hover{border-color:rgba(255,255,255,0.28);background:var(--navy-500);}
.fmt-card.selected{border-color:var(--orange);background:var(--orange-dim);}
.fmt-card-name{font-family:'Outfit',sans-serif;font-size:0.88rem;font-weight:700;margin-bottom:4px;}
.fmt-card-cols{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;}
.fmt-col-chip{font-size:0.6rem;font-weight:700;padding:2px 7px;border-radius:8px;}
.fmt-card-desc{font-size:0.72rem;color:var(--text-secondary);line-height:1.4;}

/* ── TIMER WIDGET ── */
.timer-widget{position:fixed;bottom:24px;right:24px;background:var(--navy-700);border:1px solid var(--border-strong);border-radius:var(--r-lg);padding:0;z-index:300;min-width:200px;box-shadow:0 8px 32px rgba(0,0,0,0.4);overflow:hidden;transition:all 0.2s;}
.timer-widget.minimised{min-width:0;}
.timer-hdr{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);background:var(--navy-800);}
.timer-phase-label{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-tertiary);}
.timer-hdr-right{display:flex;gap:4px;align-items:center;}
.timer-min-btn{background:none;border:none;cursor:pointer;color:var(--text-tertiary);font-size:0.8rem;padding:2px 5px;border-radius:4px;transition:all 0.15s;}
.timer-min-btn:hover{color:var(--text-primary);background:rgba(255,255,255,0.07);}
.timer-body{padding:16px 18px;}
.timer-display{font-family:'Outfit',sans-serif;font-size:2.8rem;font-weight:800;text-align:center;letter-spacing:-0.02em;margin-bottom:12px;transition:color 0.3s;}
.timer-display.urgent{color:var(--red);}
.timer-progress{height:4px;background:rgba(255,255,255,0.08);border-radius:2px;margin-bottom:14px;overflow:hidden;}
.timer-progress-bar{height:100%;border-radius:2px;transition:width 0.5s linear,background 0.3s;}
.timer-controls{display:flex;gap:6px;justify-content:center;margin-bottom:12px;}
.timer-ctrl-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border-strong);background:var(--navy-600);color:var(--text-secondary);font-size:0.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.timer-ctrl-btn:hover{background:var(--navy-500);color:var(--text-primary);}
.timer-ctrl-btn.play{background:var(--orange);border-color:var(--orange);color:white;width:40px;height:40px;border-radius:10px;font-size:1rem;}
.timer-ctrl-btn.play:hover{background:#FF7E3D;}
.timer-phases{display:flex;gap:4px;justify-content:center;}
.timer-phase-btn{font-size:0.65rem;font-weight:600;padding:3px 9px;border-radius:10px;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text-tertiary);transition:all 0.15s;font-family:'IBM Plex Sans',sans-serif;}
.timer-phase-btn:hover{color:var(--text-secondary);}
.timer-phase-btn.active{background:var(--orange-dim);border-color:var(--orange-border);color:var(--orange);}

/* ── Tabs ── */
.tabs{background:var(--navy-900);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:4px;}
.tab-btn{font-family:'IBM Plex Sans',sans-serif;font-size:0.8rem;font-weight:600;padding:12px 16px;border:none;background:none;color:var(--text-tertiary);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s;display:flex;align-items:center;gap:6px;}
.tab-btn:hover{color:var(--text-secondary);}
.tab-btn.active{color:var(--text-primary);border-bottom-color:var(--orange);}
.tab-badge{font-size:0.62rem;font-weight:700;padding:1px 6px;border-radius:10px;background:var(--navy-600);color:var(--text-tertiary);}
.tab-btn.active .tab-badge{background:var(--orange-dim);color:var(--orange);}

/* ── History view ── */
.history-page{padding:28px 24px 80px;max-width:1500px;margin:0 auto;}
.hist-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.hist-toolbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.hist-title{font-family:'Outfit',sans-serif;font-size:1.1rem;font-weight:800;letter-spacing:-0.01em;}
.hist-count{font-size:0.72rem;font-weight:700;padding:3px 10px;border-radius:12px;background:var(--navy-700);border:1px solid var(--border-strong);color:var(--text-tertiary);}

/* Team filter pills */
.team-filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:20px;}
.team-filter-btn{font-size:0.7rem;font-weight:700;padding:4px 12px;border-radius:20px;border:1px solid var(--border-strong);background:transparent;cursor:pointer;color:var(--text-tertiary);transition:all 0.15s;font-family:'IBM Plex Sans',sans-serif;}
.team-filter-btn:hover{color:var(--text-secondary);border-color:var(--border-strong);}
.team-filter-btn.active-all{background:var(--navy-600);color:var(--text-primary);border-color:var(--border-strong);}
.team-filter-btn.active-rota{background:rgba(34,201,122,0.15);color:var(--green);border-color:var(--green-border);}
.team-filter-btn.active-mobile{background:rgba(74,158,255,0.15);color:var(--blue);border-color:var(--blue-border);}
.team-filter-btn.active-payroll{background:rgba(167,139,250,0.15);color:var(--purple);border-color:var(--purple-border);}

.hist-empty{background:var(--navy-700);border:1px solid var(--border);border-radius:var(--r-lg);padding:60px 24px;text-align:center;}
.hist-empty-icon{font-size:2.5rem;margin-bottom:12px;}
.hist-empty-title{font-family:'Outfit',sans-serif;font-size:1rem;font-weight:700;margin-bottom:6px;color:var(--text-secondary);}
.hist-empty-sub{font-size:0.82rem;color:var(--text-tertiary);line-height:1.6;max-width:380px;margin:0 auto;}

/* History grid */
.hist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-bottom:28px;}
.hist-card{background:var(--navy-700);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;transition:border-color 0.15s;animation:cardIn 0.3s ease both;}
.hist-card:hover{border-color:var(--border-strong);}
@keyframes cardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.hist-card-hdr{padding:16px 18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.hist-card-title{font-family:'Outfit',sans-serif;font-size:1rem;font-weight:800;color:var(--text-primary);margin-bottom:3px;line-height:1.2;}
.hist-card-date{font-size:0.72rem;color:var(--text-tertiary);}
.hist-card-badges{display:flex;gap:5px;align-items:center;flex-shrink:0;flex-wrap:wrap;}
.hist-format-pill{font-size:0.62rem;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--orange-dim);color:var(--orange);border:1px solid var(--orange-border);white-space:nowrap;}
.hist-card-stats{padding:12px 18px;display:flex;gap:16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.hist-stat{display:flex;flex-direction:column;gap:2px;}
.hist-stat-val{font-family:'Outfit',sans-serif;font-size:1.1rem;font-weight:800;}
.hist-stat-lbl{font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-tertiary);}
.hist-col-chips{padding:10px 18px;display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--border);}
.hist-col-chip{font-size:0.62rem;font-weight:600;padding:2px 8px;border-radius:8px;}
.hist-card-actions{padding:12px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

/* Completion rate badge on history card */
.completion-badge{font-size:0.68rem;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:auto;}
.completion-high{background:rgba(34,201,122,0.15);color:var(--green);}
.completion-mid{background:rgba(245,166,35,0.15);color:var(--amber);}
.completion-low{background:rgba(255,82,82,0.15);color:var(--red);}

/* Pattern detection */
.patterns-section{background:var(--navy-700);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:28px;}
.patterns-hdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.patterns-hdr-left{display:flex;align-items:center;gap:10px;}
.patterns-hdr h3{font-family:'Outfit',sans-serif;font-size:0.9rem;font-weight:800;letter-spacing:-0.01em;}
.patterns-hint{font-size:0.72rem;color:var(--text-tertiary);}
.patterns-body{padding:16px 20px;}
.patterns-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.pattern-chip{background:var(--navy-600);border:1px solid var(--border-strong);border-radius:var(--r);padding:10px 14px;}
.pattern-theme{font-size:0.88rem;font-weight:600;color:var(--text-primary);margin-bottom:4px;text-transform:capitalize;}
.pattern-meta{font-size:0.7rem;color:var(--text-tertiary);margin-bottom:6px;}
.pattern-bar{height:3px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;}
.pattern-bar-fill{height:100%;border-radius:2px;background:var(--orange);}
.pattern-retros{font-size:0.65rem;color:var(--text-tertiary);margin-top:4px;}

/* Owner digest */
.digest-section{background:var(--navy-700);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;}
.digest-hdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.digest-hdr h3{font-family:'Outfit',sans-serif;font-size:0.9rem;font-weight:800;}
.digest-body{padding:16px 20px;display:flex;flex-direction:column;gap:16px;}
.digest-owner-block{background:var(--navy-600);border-radius:var(--r);overflow:hidden;}
.digest-owner-hdr{padding:10px 14px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.03);}
.digest-owner-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:800;color:#fff;flex-shrink:0;}
.digest-owner-name{font-size:0.88rem;font-weight:700;}
.digest-owner-count{font-size:0.68rem;color:var(--text-tertiary);margin-left:auto;}
.digest-action-row{padding:8px 14px;font-size:0.82rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.digest-action-sprint{font-size:0.65rem;color:var(--text-tertiary);white-space:nowrap;}
.digest-action-status{font-size:0.62rem;font-weight:700;padding:1px 6px;border-radius:6px;white-space:nowrap;}

/* Retro detail modal */
.retro-detail{max-width:800px !important;}
.detail-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.detail-col{background:var(--navy-600);border-radius:var(--r);overflow:hidden;}
.detail-col-hdr{padding:10px 14px;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;}
.detail-col-body{padding:10px 14px;display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;}
.detail-sticky{font-size:0.82rem;color:var(--text-primary);padding:7px 10px;border-radius:6px;border-left:2px solid;line-height:1.45;}
.detail-sticky-author{font-size:0.62rem;color:var(--text-tertiary);margin-top:3px;}
.detail-actions-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.detail-action-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--navy-600);border-radius:var(--r);font-size:0.82rem;}
.detail-action-status{font-size:0.62rem;font-weight:700;padding:2px 7px;border-radius:8px;white-space:nowrap;}
.s-todo{background:rgba(74,158,255,0.12);color:var(--blue);}
.s-inprog{background:rgba(245,166,35,0.12);color:var(--amber);}
.s-done{background:rgba(34,201,122,0.12);color:var(--green);}

/* Participant view */
#participantView{min-height:100vh;display:none;flex-direction:column;}
.p-hdr{background:var(--navy-900);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:200;}
.p-sprint-name{font-family:'Outfit',sans-serif;font-size:0.9rem;font-weight:700;color:var(--orange);}
.p-hdr-right{display:flex;align-items:center;gap:8px;}
.p-done-btn{background:var(--orange);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:0.82rem;font-weight:700;padding:8px 18px;border-radius:7px;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.15s;}
.p-done-btn:hover{background:#FF7E3D;}
.p-sticky-counter{font-size:0.72rem;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--green-dim);border:1px solid var(--green-border);color:var(--green);}
.p-body{flex:1;padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1500px;margin:0 auto;width:100%;}
.p-name-card{background:linear-gradient(135deg,rgba(255,106,26,0.1),rgba(255,106,26,0.04));border:1px solid rgba(255,106,26,0.25);border-radius:var(--r-lg);padding:16px 20px;}
.p-name-card-inner{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.p-step-label{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--orange);opacity:0.7;white-space:nowrap;}
.p-name-card-content{display:flex;align-items:center;gap:10px;flex:1;flex-wrap:wrap;}
.p-name-card-label{font-size:0.8rem;font-weight:600;color:var(--text-secondary);white-space:nowrap;}
.p-name-big-input{background:var(--navy-600);border:2px solid rgba(255,106,26,0.4);border-radius:8px;color:var(--text-primary);font-family:'IBM Plex Sans',sans-serif;font-size:0.95rem;font-weight:600;padding:8px 14px;outline:none;width:200px;transition:border-color 0.2s,box-shadow 0.2s;}
.p-name-big-input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,106,26,0.15);}
.p-name-big-input::placeholder{color:var(--text-tertiary);font-weight:400;}
.p-name-big-input.filled{border-color:var(--green);background:rgba(34,201,122,0.07);}
.p-name-hint{font-size:0.72rem;color:var(--text-tertiary);}
.p-columns{display:grid;gap:14px;flex:1;}
.p-cols-2{grid-template-columns:1fr 1fr;}
.p-cols-3{grid-template-columns:repeat(3,1fr);}
.p-cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.p-cols-3,.p-cols-4{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.p-columns{grid-template-columns:1fr!important;}}
.p-col{border-radius:var(--r-lg);display:flex;flex-direction:column;min-height:240px;overflow:hidden;border:1px solid var(--border);}
.p-col-body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1;background:var(--navy-700);}
.p-add-btn{border:1.5px dashed rgba(255,255,255,0.12);border-radius:var(--r);padding:12px 14px;background:transparent;color:var(--text-tertiary);font-family:'IBM Plex Sans',sans-serif;font-size:0.84rem;cursor:pointer;transition:all 0.15s;text-align:left;width:100%;display:flex;align-items:center;gap:8px;}
.p-add-btn:hover{border-color:rgba(255,255,255,0.25);color:var(--text-secondary);background:rgba(255,255,255,0.03);}
.p-sticky{border-radius:var(--r);padding:12px 13px;position:relative;animation:stickyIn 0.2s ease both;border-left-width:3px;border-left-style:solid;}
.p-sticky-text{font-size:0.88rem;line-height:1.5;color:var(--text-primary);word-break:break-word;}
.p-sticky-del{position:absolute;top:6px;right:7px;background:none;border:none;cursor:pointer;color:var(--text-tertiary);font-size:0.85rem;opacity:0;transition:opacity 0.15s;}
.p-sticky:hover .p-sticky-del{opacity:1;}
.p-sticky-del:hover{color:var(--red);}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(8,14,26,0.82);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;backdrop-filter:blur(4px);}
.modal{background:var(--navy-700);border:1px solid var(--border-strong);border-radius:var(--r-lg);width:100%;max-width:500px;padding:28px;animation:modalIn 0.2s ease;max-height:90vh;overflow-y:auto;}
@keyframes modalIn{from{opacity:0;transform:scale(0.96) translateY(8px);}to{opacity:1;transform:none;}}
.modal h3{font-family:'Outfit',sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:8px;}
.modal p{font-size:0.84rem;color:var(--text-secondary);line-height:1.6;margin-bottom:16px;}
.modal-code{background:var(--navy-900);border:1px solid var(--border-strong);border-radius:var(--r);padding:14px 16px;font-family:'Outfit',sans-serif;font-size:0.85rem;font-weight:700;color:var(--orange);word-break:break-all;margin-bottom:16px;line-height:1.5;max-height:120px;overflow-y:auto;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;}
.modal-textarea{width:100%;min-height:90px;background:var(--navy-900);border:1px solid var(--border-strong);border-radius:var(--r);color:var(--text-primary);font-family:'Outfit',sans-serif;font-size:0.85rem;padding:12px;outline:none;resize:vertical;margin-bottom:16px;}
.modal-textarea:focus{border-color:var(--orange);}
.modal-textarea::placeholder{color:var(--text-tertiary);}
.modal-field{margin-bottom:16px;}
.modal-field label{display:block;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-tertiary);margin-bottom:7px;}
.modal-select{width:100%;background:var(--navy-600);border:1px solid var(--border-strong);border-radius:var(--r);color:var(--text-primary);font-family:'IBM Plex Sans',sans-serif;font-size:0.88rem;padding:9px 12px;outline:none;cursor:pointer;}
.modal-select:focus{border-color:var(--orange);}

/* Carry-over stats panel */
.carry-stats{background:var(--navy-600);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;display:flex;gap:20px;flex-wrap:wrap;}
.carry-stat{display:flex;flex-direction:column;gap:2px;}
.carry-stat-val{font-family:'Outfit',sans-serif;font-size:1.4rem;font-weight:800;}
.carry-stat-lbl{font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-tertiary);}
.carry-open-list{background:var(--navy-600);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;}
.carry-open-item{font-size:0.82rem;color:var(--text-primary);padding:5px 8px;border-radius:5px;border-left:2px solid var(--amber);background:rgba(245,166,35,0.06);}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-700);border:1px solid var(--border-strong);border-radius:var(--r);padding:12px 20px;font-size:0.82rem;color:var(--text-primary);z-index:999;animation:toastIn 0.2s ease;box-shadow:0 4px 20px rgba(0,0,0,0.4);white-space:nowrap;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
.shake{animation:shake 0.4s ease;}
</style>
</head>
<body>

<!-- ══ BOARD VIEW ══ -->
<div id="boardView">
  <div class="hdr">
    <div class="logo"><div class="logo-pip"></div>S4 Labour <em>/ Retro</em></div>
    <div class="hdr-center">
      <input class="hdr-input hdr-input-name" id="sprintName" placeholder="Sprint name…" oninput="meta('sprintName',this.value)">
      <input class="hdr-input hdr-input-date" id="retroDate" type="date" oninput="meta('retroDate',this.value)">
      <button class="format-pill" id="formatPill" onclick="openFormatPicker()">
        <div class="format-pill-dot" id="formatPillDot"></div>
        <span id="formatPillLabel">Format</span> ▾
      </button>
      <span class="save-lz" id="saveLz">Ready</span>
    </div>
    <div class="hdr-right">
      <button class="btn btn-ghost" id="anonBtn" onclick="toggleAnon()" title="Anonymous mode">👤 Anon: Off</button>
      <button class="btn btn-ghost" onclick="openTimerSettings()" title="Facilitation timer">⏱ Timer</button>
      <button class="btn btn-ghost" onclick="openContribute()">👥 Share</button>
      <button class="btn btn-ghost" onclick="openImportContrib()">⬇ Merge</button>
      <button class="btn btn-primary" onclick="archiveRetro()">📁 Archive</button>
      <button class="btn btn-ghost" onclick="doExport()">Export</button>
      <button class="btn btn-danger" onclick="confirmReset()">Reset</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-board" onclick="switchTab('board')">🗂 Board</button>
    <button class="tab-btn" id="tab-history" onclick="switchTab('history')">🕐 History <span class="tab-badge" id="histTabBadge">0</span></button>
  </div>

  <div id="boardPage">
    <div class="share-bar" id="sharebar" style="display:none;">
      <span class="share-label">Contribution link</span>
      <div class="share-code-box">
        <span class="share-code" id="shareCodeDisplay"></span>
        <button class="btn btn-ghost" style="padding:3px 9px;font-size:0.7rem;" onclick="copyShareLink()">Copy link</button>
      </div>
      <div class="contrib-indicator"><div class="contrib-dot"></div><span id="contribCount">Waiting…</span></div>
      <button class="btn btn-ghost" style="padding:3px 9px;font-size:0.68rem;margin-left:auto;" onclick="closeShareBar()">✕</button>
    </div>
    <div class="page">
      <div class="summary" id="summary"></div>
      <div class="columns" id="columns"></div>
      <div class="actions-card">
        <div class="actions-hdr">
          <h2>Actions <span class="act-count" id="actCount">0</span></h2>
          <span style="font-size:0.7rem;color:var(--text-tertiary);">📌 = carry to next retro</span>
        </div>
        <div id="actionsBody"></div>
        <div class="add-action-row"><button class="btn btn-ghost" onclick="addAction()">+ Add action</button></div>
      </div>
    </div>
  </div>

  <!-- History panel -->
  <div id="historyPanel" style="display:none;">
    <div class="history-page">
      <div class="hist-toolbar">
        <div class="hist-toolbar-left">
          <div class="hist-title">Retro History</div>
          <div class="hist-count" id="histCount">0 retros</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-ghost" onclick="showOwnerDigest()">👤 Owner digest</button>
          <button class="btn btn-ghost" onclick="importDB()">⬆ Import DB</button>
          <button class="btn btn-ghost" onclick="exportDB()">⬇ Export DB</button>
        </div>
      </div>
      <div class="team-filters" id="teamFilters"></div>
      <div id="patternsSection"></div>
      <div class="hist-grid" id="histGrid"></div>
      <div id="digestSection" style="display:none;"></div>
    </div>
  </div>
</div>

<!-- ══ TIMER WIDGET ══ -->
<div class="timer-widget" id="timerWidget" style="display:none;">
  <div class="timer-hdr">
    <div class="timer-phase-label" id="timerPhaseLabel">Writing</div>
    <div class="timer-hdr-right">
      <button class="timer-min-btn" onclick="toggleTimerMin()" id="timerMinBtn">▼</button>
      <button class="timer-min-btn" onclick="closeTimer()">✕</button>
    </div>
  </div>
  <div id="timerBody" class="timer-body">
    <div class="timer-display" id="timerDisplay">05:00</div>
    <div class="timer-progress"><div class="timer-progress-bar" id="timerBar" style="width:100%;background:var(--green)"></div></div>
    <div class="timer-controls">
      <button class="timer-ctrl-btn" onclick="timerReset()" title="Reset">↺</button>
      <button class="timer-ctrl-btn play" onclick="timerToggle()" id="timerPlayBtn">▶</button>
      <button class="timer-ctrl-btn" onclick="timerNextPhase()" title="Next phase">⏭</button>
    </div>
    <div class="timer-phases" id="timerPhases"></div>
  </div>
</div>

<!-- ══ PARTICIPANT VIEW ══ -->
<div id="participantView">
  <div class="p-hdr">
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="logo"><div class="logo-pip"></div>S4 Labour <em>/ Retro</em></div>
      <div class="p-sprint-name" id="pSprintName"></div>
    </div>
    <div class="p-hdr-right">
      <span class="p-sticky-counter" id="pStickyCounter" style="display:none;"></span>
      <button class="btn btn-ghost" onclick="switchToBoard()">← Board view</button>
      <button class="p-done-btn" id="pDoneBtn" onclick="submitContribution()">✓ Done — copy my stickies</button>
    </div>
  </div>
  <div class="p-body">
    <div class="p-name-card" id="pNameCard">
      <div class="p-name-card-inner">
        <div class="p-step-label">Step 1</div>
        <div class="p-name-card-content">
          <label class="p-name-card-label" for="pName">Your name <span style="color:var(--orange)">*</span></label>
          <input class="p-name-big-input" id="pName" placeholder="e.g. Alex Smith" oninput="onPNameChange()" autocomplete="given-name">
          <span class="p-name-hint" id="pNameHint">Required before you can submit</span>
        </div>
        <div class="p-step-label" style="margin-left:auto;">Step 2 → add stickies below</div>
      </div>
    </div>
    <div class="p-columns" id="pColumns"></div>
  </div>
</div>

<!-- ══ MODAL ══ -->
<div class="modal-bg" id="modalBg" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<script>
// ══════════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════════
const TEAMS = ['Rota','Mobile','Payroll'];
const TEAM_COLORS = {Rota:'var(--green)',Mobile:'var(--blue)',Payroll:'var(--purple)'};
const TEAM_CLASSES = {Rota:'team-rota',Mobile:'team-mobile',Payroll:'team-payroll'};

const FORMATS = {
  classic:{name:'Classic',desc:'The standard retrospective.',cols:[
    {id:'went-well',label:'Went well',emoji:'✅',color:'#22C97A',dim:'rgba(34,201,122,0.14)',border:'rgba(34,201,122,0.35)',desc:'What went well this sprint?'},
    {id:'improve',label:'To improve',emoji:'🔧',color:'#F5A623',dim:'rgba(245,166,35,0.14)',border:'rgba(245,166,35,0.35)',desc:'What could have gone better?'},
    {id:'topics',label:'Ideas & topics',emoji:'💡',color:'#FF6A1A',dim:'rgba(255,106,26,0.14)',border:'rgba(255,106,26,0.38)',desc:'Topics to discuss or ideas to try'},
  ]},
  ssc:{name:'Start · Stop · Continue',desc:'Action-oriented. Identify new practices, things to drop, and what\'s working.',cols:[
    {id:'start',label:'Start',emoji:'🚀',color:'#22C97A',dim:'rgba(34,201,122,0.14)',border:'rgba(34,201,122,0.35)',desc:'New things we should start doing'},
    {id:'stop',label:'Stop',emoji:'🛑',color:'#FF5252',dim:'rgba(255,82,82,0.13)',border:'rgba(255,82,82,0.35)',desc:'Things we should stop doing'},
    {id:'continue',label:'Continue',emoji:'✅',color:'#4A9EFF',dim:'rgba(74,158,255,0.14)',border:'rgba(74,158,255,0.38)',desc:'Things that are working — keep them'},
  ]},
  '4ls':{name:'4 Ls',desc:'Liked · Learned · Lacked · Longed for. Great for deeper team reflection.',cols:[
    {id:'liked',label:'Liked',emoji:'💚',color:'#22C97A',dim:'rgba(34,201,122,0.14)',border:'rgba(34,201,122,0.35)',desc:'What did you enjoy or appreciate?'},
    {id:'learned',label:'Learned',emoji:'🧠',color:'#4A9EFF',dim:'rgba(74,158,255,0.14)',border:'rgba(74,158,255,0.38)',desc:'What did you learn this sprint?'},
    {id:'lacked',label:'Lacked',emoji:'😕',color:'#F5A623',dim:'rgba(245,166,35,0.14)',border:'rgba(245,166,35,0.35)',desc:'What was missing or insufficient?'},

const AUTHOR_COLORS=['#FF6A1A','#22C97A','#4A9EFF','#A78BFA','#F5A623','#FF5252','#38BDF8','#34D399','#FB923C','#C084FC'];
function authorColor(n){if(!n)return'#4F6080';let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))&0xffffffff;return AUTHOR_COLORS[Math.abs(h)%AUTHOR_COLORS.length];}
function initials(n){if(!n)return'?';return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function escH(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let S = {meta:{sprintName:'',retroDate:'',format:'classic',team:'',anonymous:false},stickies:[],actions:[],groups:[]};
let DB = {version:2,retros:[]};
let pStickies=[], saveTimer=null;
let histTeamFilter='all';
let draggingStickyId=null;

function currentFormat(){return FORMATS[S.meta.format]||FORMATS.classic;}
function currentCols(){return currentFormat().cols;}

// ══════════════════════════════════════════
//  SAVE / LOAD
// ══════════════════════════════════════════
function save(){clearTimeout(saveTimer);showSave('saving');saveTimer=setTimeout(()=>{try{localStorage.setItem('s4retro_v4',JSON.stringify(S));showSave('saved');}catch(e){}},700);}
function load(){try{const d=JSON.parse(localStorage.getItem('s4retro_v4'));if(d)S=d;}catch(e){}}
function loadDB(){try{const d=JSON.parse(localStorage.getItem('s4retro-db'));if(d)DB=d;}catch(e){}}
function saveDB(){try{localStorage.setItem('s4retro-db',JSON.stringify(DB));}catch(e){}}
function showSave(s){const el=document.getElementById('saveLz');if(!el)return;if(s==='saving'){el.textContent='Saving…';el.className='save-lz';}else if(s==='saved'){el.textContent='✓ Saved';el.className='save-lz saved';setTimeout(()=>{el.textContent='Auto-saved';el.className='save-lz';},2000);}}
function meta(k,v){S.meta[k]=v;save();}
function updateHistBadge(){const el=document.getElementById('histTabBadge');if(el)el.textContent=DB.retros.length;const cnt=document.getElementById('histCount');if(cnt)cnt.textContent=DB.retros.length+' retro'+(DB.retros.length!==1?'s':'');}

// ══════════════════════════════════════════
//  BROADCAST
// ══════════════════════════════════════════
let bc=null;
try{bc=new BroadcastChannel('s4retro');bc.onmessage=onBCMsg;}catch(e){}
function bcPost(msg){try{if(bc)bc.postMessage(msg);}catch(e){}}
function onBCMsg(e){
  if(e.data.type==='sticky'&&!S.stickies.find(s=>s.id===e.data.sticky.id)){S.stickies.push(e.data.sticky);renderBoard();save();}
  if(e.data.type==='ping'){updateContribCount(1);bcPost({type:'pong'});}
  if(e.data.type==='pong'){updateContribCount(1);}
  if(e.data.type==='format'){S.meta.format=e.data.format;save();applyFormat();renderBoard();}
}
function updateContribCount(d){const el=document.getElementById('contribCount');if(!el)return;const n=(parseInt(el.dataset.n||'0')+d);el.dataset.n=n;el.textContent=n+' contributor'+(n!==1?'s':'')+' online';}

// ══════════════════════════════════════════
//  ANONYMOUS MODE
// ══════════════════════════════════════════
function toggleAnon(){
  S.meta.anonymous=!S.meta.anonymous;save();
  const btn=document.getElementById('anonBtn');
  if(S.meta.anonymous){btn.textContent='👤 Anon: On';btn.classList.add('btn-anon-on');btn.classList.remove('btn-ghost');}
  else{btn.textContent='👤 Anon: Off';btn.classList.remove('btn-anon-on');btn.classList.add('btn-ghost');}
  renderBoard();
}

// ══════════════════════════════════════════
//  FORMAT
// ══════════════════════════════════════════
function applyFormat(){
  const fmt=currentFormat();const cols=currentCols();
  document.getElementById('formatPillLabel').textContent=fmt.name;
  document.getElementById('formatPillDot').style.background=cols[0].color;
  document.getElementById('columns').className='columns cols-'+Math.min(cols.length,5);
  renderBoardColumns();renderPColumns();
}
function openFormatPicker(){
  const cur=S.meta.format||'classic';
  const cards=Object.entries(FORMATS).map(([key,fmt])=>{
    const chips=fmt.cols.map(c=>`<span class="fmt-col-chip" style="background:${c.dim};color:${c.color};border:1px solid ${c.border}">${c.emoji} ${c.label}</span>`).join('');
    return `<div class="fmt-card ${key===cur?'selected':''}" onclick="selectFormat('${key}')"><div class="fmt-card-name">${fmt.name}</div><div class="fmt-card-cols">${chips}</div><div class="fmt-card-desc">${fmt.desc}</div></div>`;
  }).join('');
  showModal(`<h3>Choose format</h3><p>Changing format clears existing stickies.</p><div class="format-grid">${cards}</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div>`);
}
function selectFormat(key){
  if(key===S.meta.format){closeModal();return;}
  if(S.stickies.length>0&&!confirm('Changing format will clear all stickies. Continue?'))return;
  if(S.stickies.length>0)S.stickies=[];
  S.meta.format=key;S.groups=[];save();closeModal();applyFormat();renderBoard();bcPost({type:'format',format:key});
}

// ══════════════════════════════════════════
//  STICKY GROUPS
// ══════════════════════════════════════════
function addGroup(colId){
  if(!S.groups)S.groups=[];
  const label='Group '+(S.groups.filter(g=>g.colId===colId).length+1);
  S.groups.push({id:'g_'+Date.now(),colId,label,stickyIds:[]});
  save();renderBoardColumns();
}
function deleteGroup(gid){
  S.groups=S.groups.filter(g=>g.id!==gid);save();renderBoardColumns();
}
function renameGroup(gid,label){
  const g=S.groups.find(x=>x.id===gid);if(g){g.label=label;save();}
}
function moveStickyToGroup(stickyId,targetGid){
  if(!S.groups)S.groups=[];
  // remove from all groups first
  S.groups.forEach(g=>{g.stickyIds=g.stickyIds.filter(id=>id!==stickyId);});
  if(targetGid){const g=S.groups.find(x=>x.id===targetGid);if(g&&!g.stickyIds.includes(stickyId))g.stickyIds.push(stickyId);}
  save();renderBoardColumns();
}
function getStickyGroup(stickyId){
  if(!S.groups)return null;
  return S.groups.find(g=>g.stickyIds.includes(stickyId))||null;
}

// Drag and drop
function onStickyDragStart(e,stickyId){draggingStickyId=stickyId;e.dataTransfer.effectAllowed='move';document.getElementById('sticky-'+stickyId)?.classList.add('dragging');}
function onStickyDragEnd(e,stickyId){draggingStickyId=null;document.querySelectorAll('.sticky.dragging').forEach(el=>el.classList.remove('dragging'));document.querySelectorAll('.group-add-area').forEach(el=>el.classList.remove('drag-over'));}
function onGroupDragOver(e,gid){e.preventDefault();document.querySelectorAll('.group-add-area').forEach(el=>el.classList.remove('drag-over'));document.getElementById('garea-'+gid)?.classList.add('drag-over');}
function onGroupDrop(e,gid){e.preventDefault();if(draggingStickyId)moveStickyToGroup(draggingStickyId,gid);}
function onColDragOver(e,colId){e.preventDefault();document.querySelectorAll('.group-add-area').forEach(el=>el.classList.remove('drag-over'));const el=document.getElementById('ungrouped-area-'+colId);if(el)el.classList.add('drag-over');}
function onColDrop(e,colId){e.preventDefault();if(draggingStickyId)moveStickyToGroup(draggingStickyId,null);}

// ══════════════════════════════════════════
//  RENDER BOARD
// ══════════════════════════════════════════
function renderBoard(){renderBoardColumns();renderActions();renderSummary();}

function stickyHtml(s,col){
  const ac=S.meta.anonymous?'#4F6080':authorColor(s.author);
  const displayAuthor=S.meta.anonymous?'Anonymous':escH(s.author||'Anon');
  const displayInitials=S.meta.anonymous?'?':initials(s.author);
  const stickyStyle=`background:linear-gradient(135deg,${col.dim},rgba(0,0,0,0) 100%);border-color:${col.border};border-left-color:${col.color};`;
  return `<div class="sticky" style="${stickyStyle}" id="sticky-${s.id}" draggable="true"
    ondragstart="onStickyDragStart(event,'${s.id}')" ondragend="onStickyDragEnd(event,'${s.id}')">
    ${s.inherited?`<div class="inherited-badge">↩ from ${escH(s.inheritedFrom||'prev retro')}</div>`:''}
    <div class="sticky-text">${escH(s.text)}</div>
    <div class="sticky-foot">
      <div class="sticky-author">
        <div class="author-dot" style="background:${ac}">${displayInitials}</div>
        <span class="author-name">${displayAuthor}</span>
      </div>
      <div class="sticky-meta">
        <button class="vote-btn ${s.votes&&s.votes.length?'voted':''}" onclick="vote('${s.id}')">▲ <span>${s.votes?s.votes.length:0}</span></button>
        <button class="sticky-del" onclick="delSticky('${s.id}')">✕</button>
      </div>
    </div>
  </div>`;
}

function renderBoardColumns(){
  const colsEl=document.getElementById('columns');
  const cols=currentCols();
  colsEl.className='columns cols-'+cols.length;
  let html='';
  cols.forEach(col=>{
    const stickies=S.stickies.filter(s=>s.col===col.id);
    const groups=(S.groups||[]).filter(g=>g.colId===col.id);
    const countBadgeStyle=`background:${col.dim};color:${col.color};border:1px solid ${col.border}`;
    const hdrStyle=`background:linear-gradient(135deg,${col.dim} 0%,rgba(0,0,0,0) 100%);border-bottom:1px solid ${col.border.replace('0.35','0.2').replace('0.38','0.2').replace('0.4','0.2')}`;

    // Categorise stickies
    const groupedIds=new Set(groups.flatMap(g=>g.stickyIds));
    const ungrouped=stickies.filter(s=>!groupedIds.has(s.id));

    let bodyHtml='';

    // Render groups
    groups.forEach(g=>{
      const gStickies=g.stickyIds.map(id=>stickies.find(s=>s.id===id)).filter(Boolean);
      bodyHtml+=`<div class="sticky-group">
        <div class="sticky-group-hdr">
          <input class="sticky-group-label" value="${escH(g.label)}" onblur="renameGroup('${g.id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()">
          <span class="sticky-group-count">${gStickies.length}</span>
          <button class="sticky-group-del" onclick="deleteGroup('${g.id}')" title="Remove group">✕</button>
        </div>
        <div class="sticky-group-body" id="gbody-${g.id}"
          ondragover="onGroupDragOver(event,'${g.id}')" ondrop="onGroupDrop(event,'${g.id}')">
          ${gStickies.map(s=>stickyHtml(s,col)).join('')}
          <div class="group-add-area" id="garea-${g.id}">Drop stickies here</div>
        </div>
      </div>`;
    });

    // Ungrouped stickies
    bodyHtml+=ungrouped.map(s=>stickyHtml(s,col)).join('');

    // Drop area for ungrouping
    if(groups.length>0){
      bodyHtml+=`<div class="group-add-area" id="ungrouped-area-${col.id}" style="margin-top:4px;"
        ondragover="onColDragOver(event,'${col.id}')" ondrop="onColDrop(event,'${col.id}')">Drop here to ungroup</div>`;
    }

    bodyHtml+=`<div style="display:flex;gap:6px;align-items:center;margin-top:4px;">
      <button class="col-add" style="flex:1" onclick="startAdd('${col.id}')">+ Add sticky</button>
      <button class="add-group-btn" onclick="addGroup('${col.id}')" title="Add group">⊞ Group</button>
    </div>`;

    html+=`<div class="col" style="border-color:${col.border.replace('0.35','0.18').replace('0.38','0.18')}">
      <div class="col-hdr" style="${hdrStyle}">
        <div class="col-dot" style="background:${col.color};box-shadow:0 0 7px ${col.color}"></div>
        <div style="flex:1">
          <div class="col-title" style="color:${col.color}">${col.emoji} ${col.label}</div>
          <div class="col-desc" style="color:${col.color}">${col.desc}</div>
        </div>
        <span class="col-count" style="${countBadgeStyle}">${stickies.length}</span>
      </div>
      <div class="col-body" id="body-${col.id}">${bodyHtml}</div>
    </div>`;
  });
  colsEl.innerHTML=html;
}

function renderSummary(){
  const cols=currentCols();
  const open=S.actions.filter(a=>a.status!=='Done').length;
  const carry=S.actions.filter(a=>a.carryForward).length;
  let html='';
  cols.forEach(col=>{
    const n=S.stickies.filter(s=>s.col===col.id).length;
    html+=`<div class="sum-card" style="background:linear-gradient(135deg,${col.dim},rgba(0,0,0,0));border-color:${col.border}"><div class="sum-lbl" style="color:${col.color}">${col.label}</div><div class="sum-val" style="color:${col.color}">${n}</div></div>`;
  });
  html+=`<div class="sum-card" style="background:var(--orange-dim);border-color:var(--orange-border)"><div class="sum-lbl" style="color:var(--orange)">Open actions</div><div class="sum-val" style="color:var(--orange)">${open}</div></div>`;
  html+=`<div class="sum-card" style="background:var(--navy-700);border-color:var(--border-strong)"><div class="sum-lbl" style="color:var(--text-tertiary)">Carry fwd</div><div class="sum-val" style="color:var(--text-secondary)">${carry}</div></div>`;
  if(S.meta.team){html+=`<div class="sum-card" style="background:var(--navy-700);border-color:var(--border-strong)"><div class="sum-lbl" style="color:var(--text-tertiary)">Team</div><div style="margin-top:4px;"><span class="team-badge ${TEAM_CLASSES[S.meta.team]||'team-none'}">${escH(S.meta.team)}</span></div></div>`;}
  document.getElementById('summary').innerHTML=html;
}

// ══════════════════════════════════════════
//  ADD STICKY
// ══════════════════════════════════════════
let activeEditor=null;
function startAdd(colId){
  if(activeEditor)commitEditor();
  const col=currentCols().find(c=>c.id===colId);
  const body=document.getElementById('body-'+colId);if(!body)return;
  const addRow=body.querySelector('div[style*="display:flex"]');
  const editorEl=document.createElement('div');
  editorEl.className='sticky-editor';
  editorEl.style.borderColor=col?col.color:'var(--orange)';
  editorEl.innerHTML=`<textarea id="editorTA" placeholder="Type sticky… (Enter to save, Shift+Enter for new line)" autofocus></textarea>
    <div class="editor-foot">
      <span class="editor-hint">Enter ↵ save · Esc cancel</span>
      <div style="display:flex;gap:6px;align-items:center;">
        <input id="editorAuthor" placeholder="Your name…" style="background:var(--navy-700);border:1px solid var(--border-strong);border-radius:5px;color:var(--text-primary);font-family:'IBM Plex Sans',sans-serif;font-size:0.75rem;padding:3px 9px;outline:none;width:120px;" value="${escH(S.meta._lastAuthor||'')}">
        <button class="btn btn-primary" style="padding:4px 12px;font-size:0.75rem;" onclick="commitEditor()">Save</button>
      </div>
    </div>`;
  body.insertBefore(editorEl,addRow);
  activeEditor={colId,el:editorEl};
  const ta=editorEl.querySelector('#editorTA');ta.focus();
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();commitEditor();}if(e.key==='Escape')cancelEditor();});
}
function commitEditor(){
  if(!activeEditor)return;
  const ta=activeEditor.el.querySelector('#editorTA');
  const authorEl=activeEditor.el.querySelector('#editorAuthor');
  const text=ta.value.trim();const author=(authorEl.value||'').trim();const colId=activeEditor.colId;
  if(text){
    const sticky={id:'s_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),col:colId,text,author,votes:[]};
    S.stickies.push(sticky);if(author)S.meta._lastAuthor=author;
    save();bcPost({type:'sticky',sticky});renderBoard();
  }
  activeEditor.el.remove();activeEditor=null;
  if(text)startAdd(colId);
}
function cancelEditor(){if(!activeEditor)return;activeEditor.el.remove();activeEditor=null;}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cancelEditor();});

function vote(id){const s=S.stickies.find(x=>x.id===id);if(!s)return;if(!s.votes)s.votes=[];const idx=s.votes.indexOf('board');if(idx>=0)s.votes.splice(idx,1);else s.votes.push('board');save();renderBoard();}
function delSticky(id){S.stickies=S.stickies.filter(x=>x.id!==id);if(S.groups)S.groups.forEach(g=>{g.stickyIds=g.stickyIds.filter(sid=>sid!==id);});save();renderBoard();}

function renderActions(){
  const body=document.getElementById('actionsBody');document.getElementById('actCount').textContent=S.actions.length;
  if(!S.actions.length){body.innerHTML='<div style="padding:20px;font-size:0.84rem;color:var(--text-tertiary);">No actions yet.</div>';return;}
  let html=`<table class="action-table"><thead><tr><th style="width:38%">Action</th><th style="width:16%">Owner</th><th style="width:13%">Status</th><th style="width:14%">Carry fwd</th><th></th></tr></thead><tbody>`;
  S.actions.forEach((a,i)=>{
    html+=`<tr class="${a.inherited?'inherited-action':''}">
      <td>${a.inherited?`<div class="inherited-badge" style="margin-bottom:4px;">↩ from ${escH(a.inheritedFrom||'prev retro')}</div>`:''}
        <input class="act-input" value="${escH(a.text)}" placeholder="Describe the action…" oninput="setAct(${i},'text',this.value)"></td>
      <td><input class="act-input" style="color:var(--text-secondary);font-size:0.82rem;" value="${escH(a.owner||'')}" placeholder="Owner…" oninput="setAct(${i},'owner',this.value)"></td>
      <td><select class="status-sel" onchange="setAct(${i},'status',this.value)">
        <option ${a.status==='To Do'?'selected':''}>To Do</option>
        <option ${a.status==='In Progress'?'selected':''}>In Progress</option>
        <option ${a.status==='Done'?'selected':''}>Done</option>
      </select></td>
      <td><button class="carry-btn ${a.carryForward?'on':''}" onclick="toggleCarry(${i})">${a.carryForward?'📌 Yes':'Pin'}</button></td>
      <td style="text-align:right;padding-right:12px;"><button class="act-del" onclick="delAction(${i})">✕</button></td>
    </tr>`;
  });
  html+='</tbody></table>';body.innerHTML=html;
}
function addAction(){S.actions.push({id:'a_'+Date.now(),text:'',owner:'',status:'To Do',carryForward:false,inherited:false});save();renderActions();setTimeout(()=>{const inputs=document.querySelectorAll('#actionsBody .act-input');if(inputs.length)inputs[inputs.length-2].focus();},50);}
function setAct(i,k,v){S.actions[i][k]=v;save();if(k==='status')renderActions();}
function toggleCarry(i){S.actions[i].carryForward=!S.actions[i].carryForward;save();renderActions();renderSummary();}
function delAction(i){S.actions.splice(i,1);save();renderActions();renderSummary();}

// ══════════════════════════════════════════
//  TIMER
// ══════════════════════════════════════════
const TIMER_PHASES=[
  {id:'writing',label:'Silent Writing',secs:5*60,color:'#22C97A'},
  {id:'discuss',label:'Discussion',secs:15*60,color:'#4A9EFF'},
  {id:'actions',label:'Actions',secs:10*60,color:'#FF6A1A'},
];
let timerState={phase:0,timeLeft:TIMER_PHASES[0].secs,total:TIMER_PHASES[0].secs,running:false,interval:null};

function openTimerSettings(){
  document.getElementById('timerWidget').style.display='';
  renderTimer();
}
function closeTimer(){document.getElementById('timerWidget').style.display='none';timerPause();}
function toggleTimerMin(){
  const body=document.getElementById('timerBody');const btn=document.getElementById('timerMinBtn');
  if(body.style.display==='none'){body.style.display='';btn.textContent='▼';}
  else{body.style.display='none';btn.textContent='▲';}
}
function timerToggle(){if(timerState.running)timerPause();else timerStart();}
function timerStart(){
  if(timerState.timeLeft<=0)timerReset();
  timerState.running=true;
  document.getElementById('timerPlayBtn').textContent='⏸';
  timerState.interval=setInterval(()=>{
    timerState.timeLeft--;renderTimerDisplay();
    if(timerState.timeLeft<=0){timerPause();timerDone();}
  },1000);
}
function timerPause(){timerState.running=false;clearInterval(timerState.interval);document.getElementById('timerPlayBtn').textContent='▶';}
function timerReset(){timerPause();timerState.timeLeft=timerState.total;renderTimerDisplay();}
function timerNextPhase(){timerPause();timerState.phase=(timerState.phase+1)%TIMER_PHASES.length;timerState.timeLeft=TIMER_PHASES[timerState.phase].secs;timerState.total=timerState.total=TIMER_PHASES[timerState.phase].secs;renderTimer();}
function timerSetPhase(i){timerPause();timerState.phase=i;timerState.timeLeft=TIMER_PHASES[i].secs;timerState.total=TIMER_PHASES[i].secs;renderTimer();}
function timerDone(){
  const ph=TIMER_PHASES[timerState.phase];
  toast('⏰ '+ph.label+' time is up!');
  try{const ctx=new AudioContext();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(880,ctx.currentTime);g.gain.setValueAtTime(0.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);o.start();o.stop(ctx.currentTime+0.5);}catch(e){}
}

// ══════════════════════════════════════════
//  PATTERN DETECTION
// ══════════════════════════════════════════
const STOP_WORDS=new Set(['the','a','an','and','or','but','in','on','at','to','for','of','with','by','from','is','was','are','were','be','been','i','we','our','the','this','that','it','they','their','have','had','has','not','we','my','your','as','so','do','did','can','could','would','should','will','just','been','also','into','more','very','if','up','than','then','there','when','what','which','how','all','any','some','no','out','get','got','need','its','about','been','one','two','three']);

function analyzePatterns(){
  if(DB.retros.length<2)return[];
  const wordRetros={};
  DB.retros.forEach(r=>{
    const seen=new Set();
    r.stickies.forEach(s=>{
      const words=s.text.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>3&&!STOP_WORDS.has(w));
      // also bigrams
      for(let i=0;i<words.length-1;i++){const bi=words[i]+' '+words[i+1];if(!seen.has(bi)){seen.add(bi);if(!wordRetros[bi])wordRetros[bi]={count:0,retros:[]};wordRetros[bi].count++;wordRetros[bi].retros.push(r.meta.sprintName||'Unnamed');}}
      words.forEach(w=>{if(!seen.has(w)){seen.add(w);if(!wordRetros[w])wordRetros[w]={count:0,retros:[]};wordRetros[w].count++;wordRetros[w].retros.push(r.meta.sprintName||'Unnamed');}});
    });
  });
  return Object.entries(wordRetros).filter(([,v])=>v.count>=2).sort((a,b)=>b[1].count-a[1].count).slice(0,12);
}

function renderPatternsSection(){
  const el=document.getElementById('patternsSection');if(!el)return;
  const patterns=analyzePatterns();
  if(!patterns.length){el.innerHTML='';return;}
  const maxCount=patterns[0][1].count;
  const chips=patterns.map(([word,data])=>`<div class="pattern-chip">
    <div class="pattern-theme">${escH(word)}</div>
    <div class="pattern-meta">Appears in ${data.count} retro${data.count!==1?'s':''}</div>
    <div class="pattern-bar"><div class="pattern-bar-fill" style="width:${Math.round(data.count/maxCount*100)}%"></div></div>
    <div class="pattern-retros">${data.retros.slice(0,3).map(escH).join(', ')}${data.retros.length>3?'…':''}</div>
  </div>`).join('');
  el.innerHTML=`<div class="patterns-section">
    <div class="patterns-hdr">
      <div class="patterns-hdr-left"><h3>🔁 Recurring Themes</h3><span class="patterns-hint">Words &amp; phrases appearing across multiple retros</span></div>
    </div>
    <div class="patterns-body"><div class="patterns-grid">${chips}</div></div>
  </div>`;
}

function loadCarryForward(id){
  const r=DB.retros.find(x=>x.id===id);if(!r)return;
  const total=r.actions.length;
  const done=r.actions.filter(a=>a.status==='Done').length;
  const toCarry=r.actions.filter(a=>a.carryForward&&a.status!=='Done');
  if(!toCarry.length){toast('No carry-forward actions in this retro.');return;}
  const pct=total>0?Math.round(done/total*100):0;
  const compClass=pct>=70?'completion-high':pct>=40?'completion-mid':'completion-low';
  const openList=toCarry.map(a=>`<div class="carry-open-item">${escH(a.text)}${a.owner?` <span style="color:var(--text-tertiary);font-size:0.72rem;">· ${escH(a.owner)}</span>`:''}</div>`).join('');
  showModal(`<h3>Import actions from "${escH(r.meta.sprintName||'retro')}"</h3>
    <div class="carry-stats">
      <div class="carry-stat"><div class="carry-stat-val" style="color:var(--text-secondary)">${total}</div><div class="carry-stat-lbl">Total actions</div></div>
      <div class="carry-stat"><div class="carry-stat-val" style="color:var(--green)">${done}</div><div class="carry-stat-lbl">Completed</div></div>
      <div class="carry-stat"><div class="carry-stat-val" style="color:var(--red)">${total-done}</div><div class="carry-stat-lbl">Open</div></div>
      <div class="carry-stat"><div class="carry-stat-val ${compClass}" style="padding:0">${pct}%</div><div class="carry-stat-lbl">Completion rate</div></div>
    </div>
    <p style="margin-bottom:8px;">${toCarry.length} action${toCarry.length!==1?'s':''} marked 📌 to carry forward:</p>
    <div class="carry-open-list">${openList}</div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="doCarryForward('${id}')">Import ${toCarry.length} action${toCarry.length!==1?'s':''}</button></div>`);
}
function doCarryForward(id){
  const r=DB.retros.find(x=>x.id===id);if(!r)return;
  const toCarry=r.actions.filter(a=>a.carryForward&&a.status!=='Done');
  let added=0;
  toCarry.forEach(a=>{if(!S.actions.find(x=>x.inheritedFrom===(r.meta.sprintName||'prev')&&x.text===a.text)){S.actions.unshift({id:'a_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),text:a.text,owner:a.owner||'',status:'To Do',carryForward:false,inherited:true,inheritedFrom:r.meta.sprintName||'prev retro'});added++;}});
  save();renderActions();renderSummary();closeModal();switchTab('board');toast(`✓ Imported ${added} action${added!==1?'s':''}`);
}

function importDB(){showModal(`<h3>Import retro database</h3><p>Existing history will be merged — duplicates are skipped.</p><div style="margin-bottom:16px;"><input type="file" accept=".json" id="dbImportFile" style="font-size:0.82rem;color:var(--text-secondary);"></div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="doImportDB()">Import &amp; merge</button></div>`);}
function doImportDB(){
  const f=document.getElementById('dbImportFile').files[0];if(!f){alert('Select a file.');return;}
  const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);const incoming=d.retros||[];let added=0;incoming.forEach(retro=>{if(!DB.retros.find(x=>x.id===retro.id)){DB.retros.push(retro);added++;}});DB.retros.sort((a,b)=>new Date(b.archivedAt)-new Date(a.archivedAt));saveDB();renderHistoryTab();closeModal();toast(`✓ Imported ${added} retro${added!==1?'s':''} (${incoming.length-added} already existed).`);}catch{alert('Invalid file.');}};r.readAsText(f);
}

// ══════════════════════════════════════════
//  PARTICIPANT VIEW
// ══════════════════════════════════════════
let pMode=false;
function switchToParticipant(){pMode=true;document.getElementById('boardView').style.display='none';document.getElementById('participantView').style.display='flex';document.getElementById('pSprintName').textContent=S.meta.sprintName||'';pStickies=[];renderPColumns();updatePCounter();bcPost({type:'ping'});setTimeout(()=>document.getElementById('pName').focus(),100);}
function switchToBoard(){pMode=false;document.getElementById('participantView').style.display='none';document.getElementById('boardView').style.display='block';}
function onPNameChange(){const name=document.getElementById('pName').value.trim();const input=document.getElementById('pName');const hint=document.getElementById('pNameHint');if(name){input.classList.add('filled');hint.textContent='✓ Good';hint.style.color='var(--green)';}else{input.classList.remove('filled');hint.textContent='Required before you can submit';hint.style.color='';}updatePCounter();}
function updatePCounter(){const el=document.getElementById('pStickyCounter');if(!el)return;if(pStickies.length>0){el.style.display='inline-flex';el.textContent=pStickies.length+' '+(pStickies.length===1?'sticky':'stickies')+' ready';}else el.style.display='none';}
function renderPColumns(){
  const pColsEl=document.getElementById('pColumns');if(!pColsEl)return;
  const cols=currentCols();const cnt=cols.length;
  pColsEl.className='p-columns '+(cnt<=2?'p-cols-2':cnt===3?'p-cols-3':'p-cols-4');
  pColsEl.innerHTML=cols.map(col=>{
    const mine=pStickies.filter(s=>s.col===col.id);
    const hdrStyle=`background:linear-gradient(135deg,${col.dim} 0%,rgba(0,0,0,0) 100%);border-bottom:1px solid ${col.border.replace('0.35','0.2').replace('0.38','0.2')}`;
    const stickiesHtml=mine.map(s=>`<div class="p-sticky" style="background:linear-gradient(135deg,${col.dim},rgba(0,0,0,0));border-left-color:${col.color};border-color:${col.border};"><button class="p-sticky-del" onclick="pDelSticky('${s.id}')">✕</button><div class="p-sticky-text">${escH(s.text)}</div></div>`).join('');
    return `<div class="p-col" style="border-color:${col.border.replace('0.35','0.18').replace('0.38','0.18')}">
      <div class="col-hdr" style="${hdrStyle}"><div class="col-dot" style="background:${col.color};box-shadow:0 0 7px ${col.color}"></div><div style="flex:1"><div class="col-title" style="color:${col.color};font-family:'Outfit',sans-serif;font-size:0.85rem;font-weight:800;text-transform:uppercase;letter-spacing:0.07em;">${col.emoji} ${col.label}</div><div class="col-desc" style="color:${col.color}">${col.desc}</div></div></div>
      <div class="p-col-body" id="p-body-${col.id}">${stickiesHtml}<button class="p-add-btn" onclick="pStartAdd('${col.id}')">＋ Click to add a sticky…</button></div>
    </div>`;
  }).join('');
}
let pActiveEditor=null;
function pStartAdd(colId){
  if(pActiveEditor)pCommitEditor();
  const col=currentCols().find(c=>c.id===colId);
  const body=document.getElementById('p-body-'+colId);if(!body)return;
  const addBtn=body.querySelector('.p-add-btn');
  const editorEl=document.createElement('div');editorEl.className='sticky-editor';editorEl.style.borderColor=col?col.color:'var(--orange)';
  editorEl.innerHTML=`<textarea id="pEditorTA" placeholder="What's on your mind? (Enter to save)" autofocus style="background:none;border:none;outline:none;width:100%;font-family:'IBM Plex Sans',sans-serif;font-size:0.88rem;color:var(--text-primary);line-height:1.5;resize:none;min-height:60px;"></textarea><div class="editor-foot"><span class="editor-hint">Enter ↵ save · Esc cancel</span><button class="btn btn-primary" style="padding:4px 12px;font-size:0.75rem;" onclick="pCommitEditor()">Add</button></div>`;
  body.insertBefore(editorEl,addBtn);pActiveEditor={colId,el:editorEl};
  const ta=editorEl.querySelector('#pEditorTA');ta.focus();
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();pCommitEditor();}if(e.key==='Escape')pCancelEditor();});
}
function pCommitEditor(){if(!pActiveEditor)return;const ta=pActiveEditor.el.querySelector('#pEditorTA');const text=ta.value.trim();const colId=pActiveEditor.colId;if(text){pStickies.push({id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),col:colId,text,votes:[]});renderPColumns();}pActiveEditor.el.remove();pActiveEditor=null;updatePCounter();}
function pCancelEditor(){if(!pActiveEditor)return;pActiveEditor.el.remove();pActiveEditor=null;}
function pDelSticky(id){pStickies=pStickies.filter(s=>s.id!==id);renderPColumns();updatePCounter();}
function submitContribution(){
  const name=document.getElementById('pName').value.trim();
  if(!name){const card=document.getElementById('pNameCard');const hint=document.getElementById('pNameHint');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');document.getElementById('pName').focus();hint.textContent='← Enter your name first';hint.style.color='var(--red)';setTimeout(()=>card.classList.remove('shake'),500);return;}
  if(!pStickies.length){toast('Add at least one sticky before submitting.');return;}
  const tagged=pStickies.map(s=>({...s,author:name}));
  const code=btoa(JSON.stringify({author:name,stickies:tagged,sprint:S.meta.sprintName,format:S.meta.format,ts:Date.now()}));
  tagged.forEach(s=>{if(!S.stickies.find(x=>x.id===s.id)){S.stickies.push(s);bcPost({type:'sticky',sticky:s});}});save();
  showModal(`<h3>Your stickies are ready ✓</h3><p style="margin-bottom:12px;">Send this code to the facilitator via <strong>Slack or Teams</strong>. They click <strong>Merge</strong> and paste it in.</p><div class="modal-code" id="contribCodeEl">${code}</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Close</button><button class="btn btn-primary" id="copyCodeBtn" onclick="copyContribCode()">📋 Copy code</button></div>`);
  pStickies=[];updatePCounter();
}
function copyContribCode(){const code=document.getElementById('contribCodeEl').textContent.trim();navigator.clipboard.writeText(code).then(()=>{const btn=document.getElementById('copyCodeBtn');if(btn){btn.textContent='✓ Copied!';btn.disabled=true;}toast('Contribution code copied!');});}

// ══════════════════════════════════════════
//  HASH ROUTING + MODAL + TOAST
// ══════════════════════════════════════════
function checkRoute(){if(window.location.hash==='#contribute')switchToParticipant();else if(pMode)switchToBoard();}
window.addEventListener('hashchange',checkRoute);
function showModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modalBg').style.display='flex';}
function closeModal(){document.getElementById('modalBg').style.display='none';document.querySelectorAll('.modal').forEach(m=>m.classList.remove('retro-detail'));}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(()=>t.remove(),300);},2800);}

// ══════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════
function boot(){
  load();loadDB();
  if(!S.meta.format)S.meta.format='classic';
  if(!S.groups)S.groups=[];
  document.getElementById('sprintName').value=S.meta.sprintName||'';
  document.getElementById('retroDate').value=S.meta.retroDate||'';
  if(S.meta.anonymous){const btn=document.getElementById('anonBtn');btn.textContent='👤 Anon: On';btn.classList.add('btn-anon-on');btn.classList.remove('btn-ghost');}
  applyFormat();renderBoard();updateHistBadge();checkRoute();
}
boot();
</script>
